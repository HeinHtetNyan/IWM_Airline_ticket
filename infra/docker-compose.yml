services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - JWT_SECRET=${JWT_SECRET}
      - ALGORITHM=${ALGORITHM:-HS256}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      - CANCELLED_BOOKING_DELETE_DAYS=${CANCELLED_BOOKING_DELETE_DAYS:-7}
      - CORS_ALLOW_ORIGINS=${CORS_ALLOW_ORIGINS:-http://localhost:3000}
      - FLIGHT_CACHE_TTL=${FLIGHT_CACHE_TTL:-900}
      - TRUSTED_PROXY_CIDRS=${TRUSTED_PROXY_CIDRS:-127.0.0.1/32}
      - STORAGE_TYPE=${STORAGE_TYPE:-local}
      - UPLOAD_DIR=${UPLOAD_DIR:-/app/uploads}
      - PYTHONPATH=/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "${BACKEND_PORT:-8000}"
    volumes:
      # Mount your local backend code into the container at /app/backend
      - ../backend:/app/backend:ro
      # Mount tests so they can be executed inside the container
      - ../backend/tests:/app/backend/tests:ro
      # Use a named volume for uploads (avoid Windows bind‑mount issues)
      - uploads_data:/app/uploads
    working_dir: /app
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "${BACKEND_PORT:-8000}"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,sys,urllib.request; port=os.environ.get('BACKEND_PORT', '8000'); sys.exit(0 if urllib.request.urlopen(f'http://localhost:{port}/api/health').status == 200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - app_network
      - monitoring_network
      # - mail_network # Uncomment when using local mailpit SMTP server (do not delete_network)

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --pass \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - app_network

  prometheus:
    image: prom/prometheus:latest
    container_name: air-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
    depends_on:
      - backend
    networks:
      - monitoring_network

  grafana:
    image: grafana/grafana:latest
    container_name: air-grafana
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3003/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - monitoring_network

  test_runner:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: airline-test-runner
    profiles:
      - test
    env_file:
      - ../.env.test
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - ENVIRONMENT=test
      - POSTGRES_HOST=db
      - REDIS_HOST=redis
      - JWT_SECRET=test-secret-key-do-not-use-in-production
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - ../backend:/app/backend:ro
      - ../backend/tests:/app/backend/tests:ro
      - test_results:/app/test_results
    working_dir: /app
    command: ["pytest", "backend/tests/", "-v", "--tb=short", "--junitxml=test_results/results.xml"]
    networks:
      - app_network
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  uploads_data:
  test_results:

networks:
  app_network:
    driver: bridge
  monitoring_network:
    driver: bridge
  # mail_network: #uncomment when using local mailpit SMTP server (do not delete_network)
    # external: true
    # name: mail_network