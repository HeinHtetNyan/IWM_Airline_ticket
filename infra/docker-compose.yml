

services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: air-backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    expose:
      - "8000"   # internal only
    volumes:
      - ../:/app:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status==200 else 1)"
        ] 
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  db:
    image: postgres:15-alpine
    container_name: air-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airticket
      POSTGRES_PASSWORD: ChangeThisStrongPass789!
      POSTGRES_DB: airticket_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airticket -d airticket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: air-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-default-strong-pass}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-default-strong-pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: air-nginx
    restart: unless-stopped
    ports:
      - "3000:3000"   # frontend
      - "8080:8080"   # backend gateway
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/build:/usr/share/nginx/html:ro
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data: