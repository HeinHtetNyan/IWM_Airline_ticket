services:
  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    container_name: air-backend
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../:/app:ro
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  db:
    image: postgres:15-alpine
    container_name: air-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: airticket
      POSTGRES_PASSWORD: ChangeThisStrongPass789!
      POSTGRES_DB: airticket_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airticket -d airticket_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: air-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-default-strong-pass}
    env_file:
      - ../.env
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-default-strong-pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    container_name: air-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
    command: >
      sh -c "sleep 10 && nginx -g 'daemon off;'"

volumes:
  postgres_data:
  redis_data: