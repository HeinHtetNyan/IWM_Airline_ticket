name: CD - Deploy to Server

on:
  push:
    branches:
      - main
      - Bug_Fix_V1

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: production  # GitHub environment with protection rules

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # If you're using a container registry, you might skip building here and use the image built in CI.
      # For this example, we'll build and push again (or you can download the built image from CI).
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/airline-backend:${{ github.sha }}, ${{ secrets.DOCKER_USERNAME }}/airline-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            # Change to the project directory (ensure this path exists on server)
            cd /opt/airline-ticket

            # Pull latest docker-compose.yml from repo (or you can keep it in place)
            git pull origin ${{ github.ref_name }}

            # Pull the new image from Docker Hub
            docker pull ${{ secrets.DOCKER_USERNAME }}/airline-backend:${{ github.sha }}

            # Update the docker-compose.yml to use the new image tag
            sed -i "s|image: .*/airline-backend:.*|image: ${{ secrets.DOCKER_USERNAME }}/airline-backend:${{ github.sha }}|" infra/docker-compose.yml

            # Perform a rolling update (docker-compose up -d will recreate changed services)
            cd infra
            docker-compose up -d --no-deps --build backend

            # Wait for health check
            echo "Waiting for backend to become healthy..."
            for i in {1..30}; do
              if curl -s -f http://localhost:8000/api/health; then
                echo "✅ Backend is healthy!"
                break
              fi
              echo "Attempt $i/30 - backend not ready, sleeping 2s..."
              sleep 2
            done

            # If still not healthy, rollback
            if ! curl -s -f http://localhost:8000/api/health; then
              echo "❌ Health check failed, rolling back to previous version..."
              docker-compose down backend
              docker-compose up -d backend
              exit 1
            fi

            # Clean up old images
            docker image prune -f