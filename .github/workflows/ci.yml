name: CI - Test  Code

on:
  push:
    branches: [main, Bug_Fix_V1]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Smoke Tests & Docker Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: |
          docker build -f infra/Dockerfile -t flyqm/air_ticket:${{ github.sha }} .
      - name: Run smoke tests (inside container)
        run: |
          docker run --rm --network host \
            -e PYTHONPATH=/app \
            -e ENVIRONMENT=test \
            -e POSTGRES_USER=testuser \
            -e POSTGRES_PASSWORD=testpass \
            -e POSTGRES_DB=testdb \
            -e POSTGRES_DBNAME=testdb \
            -e POSTGRES_HOST=localhost \
            -e POSTGRES_PORT=5432 \
            -e REDIS_HOST=localhost \
            -e REDIS_PORT=6379 \
            -e REDIS_PASSWORD="" \
            -e JWT_SECRET=test-secret-key-for-ci-only-not-production \
            -e ALGORITHM=HS256 \
            -e ACCESS_TOKEN_EXPIRE_MINUTES=60 \
            -e CANCELLED_BOOKING_DELETE_DAYS=7 \
            -e CORS_ALLOW_ORIGINS=http://localhost:3000 \
            -e FLIGHT_CACHE_TTL=900 \
            -e TRUSTED_PROXY_CIDRS=127.0.0.1/32 \
            -e STORAGE_TYPE=local \
            -e UPLOAD_DIR=./uploads \
            -e TICKET_API_KEY=test-ticket-api-key \
            -e CURRENCY_API_KEY=test-currency-api-key \
            -e MAILTRAP_API_TOKEN=test-mailtrap-token \
            flyqm/air_ticket:${{ github.sha }} \
            python -m pytest backend/tests/test_smoke.py -v --tb=short

      - name: Validate docker-compose
        run: |
          cat > .env << 'EOF'
          ENVIRONMENT=development
          JWT_SECRET=ci-dummy-secret
          ALGORITHM=HS256
          ACCESS_TOKEN_EXPIRE_MINUTES=60
          CANCELLED_BOOKING_DELETE_DAYS=7
          CORS_ALLOW_ORIGINS=http://localhost:3000
          FLIGHT_CACHE_TTL=900
          TRUSTED_PROXY_CIDRS=127.0.0.1/32
          STORAGE_TYPE=local
          UPLOAD_DIR=/app/uploads
          MAILTRAP_API_TOKEN=ci-dummy-token
          POSTGRES_USER=testuser
          POSTGRES_PASSWORD=testpass
          POSTGRES_DB=testdb
          POSTGRES_DBNAME=testdb
          REDIS_PASSWORD=
          REDIS_HOST=redis
          REDIS_PORT=6379
          REDIS_DB=0
          TICKET_API_KEY=ci-dummy-ticket-key
          CURRENCY_API_KEY=ci-dummy-currency-key
          BASE_URL=http://localhost:8000
          DB_POOL_SIZE=5
          DB_MAX_OVERFLOW=10
          DB_POOL_TIMEOUT=30
          DB_POOL_RECYCLE=1800
          BACKEND_PORT=8000
          POSTGRES_HOST_PORT=5433
          NGINX_PORT=8080
          EOF
          cp .env .env.test
          cd infra
          docker compose config

      
      - name: Build and push image to Docker Hub
        if: github.event_name == 'push'
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
          docker push flyqm/air_ticket:${{ github.sha }}