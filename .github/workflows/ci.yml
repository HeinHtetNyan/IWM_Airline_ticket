name: CI - Test My Code

on:
  push:
    branches: [main, Bug_Fix_V1]
  pull_request:
    branches: [main]

jobs:
  # ── JOB 1: Lint + security + smoke tests ────────────────────────────────
  test:
    name: Lint, Security & Smoke Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install flake8 black bandit pytest pytest-asyncio httpx

      - name: Lint with flake8
        run: |
          python -m flake8 backend/app \
            --count \
            --max-complexity=10 \
            --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --statistics

      - name: Check formatting with black
        run: |
          python -m black --check --diff backend/app

      - name: Security scan with bandit
        run: |
          python -m bandit -r backend/app -ll -f json -o bandit-report.json
          python -m bandit -r backend/app -ll

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-security-report
          path: bandit-report.json

      - name: Run smoke tests
        run: |
          python -m pytest backend/tests/test_smoke.py -v --tb=short
        env:
          PYTHONPATH: .
          ENVIRONMENT: test
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          REDIS_PASSWORD: ""
          JWT_SECRET: test-secret-key-for-ci-only-not-production
          ALGORITHM: HS256
          ACCESS_TOKEN_EXPIRE_MINUTES: 60
          CANCELLED_BOOKING_DELETE_DAYS: 7
          CORS_ALLOW_ORIGINS: http://localhost:3000
          FLIGHT_CACHE_TTL: 900
          TRUSTED_PROXY_CIDRS: 127.0.0.1/32
          STORAGE_TYPE: local
          UPLOAD_DIR: /app/uploads
          MAILTRAP_API_TOKEN: test

  # ── JOB 2: Docker build — only runs AFTER tests pass ────────────────────
  docker-build:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./infra/Dockerfile
          load: true
          tags: airline-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

      - name: Validate docker-compose config
        run: |
          cd infra
          docker compose config

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Bug_Fix_V1'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push image to Docker Hub
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/Bug_Fix_V1'
        run: |
          BRANCH_TAG=$(echo "${{ github.ref_name }}" | tr '/' '-' | tr '_' '-' | tr '[:upper:]' '[:lower:]')
          docker tag airline-backend:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/airline-backend:${{ github.sha }}
          docker tag airline-backend:${{ github.sha }} \
            ${{ secrets.DOCKER_USERNAME }}/airline-backend:${BRANCH_TAG}
          docker push ${{ secrets.DOCKER_USERNAME }}/airline-backend:${{ github.sha }}
          docker push ${{ secrets.DOCKER_USERNAME }}/airline-backend:${BRANCH_TAG}